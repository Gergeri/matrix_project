name: Software Testing LR4

on:
  push:
  pull_request:

jobs:
  testing:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install coverage flake8

      - name: Check code style
        run: python -m flake8 src tests

      - name: Run all tests with branch coverage
        run: python -m coverage run --branch --source=src -m unittest discover -s tests -v

      - name: Check coverage
        run: python -m coverage report -m --fail-under=80
